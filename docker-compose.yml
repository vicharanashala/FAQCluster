services:

  pipeline:
    image: vicharanashala/faqcluster-pipeline:latest
    build:
      context: ./pipeline_server
      dockerfile: Dockerfile
    expose:
      - "8031"
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - LLM_API_URL=${LLM_API_URL}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_DISABLE_THINKING=${LLM_DISABLE_THINKING}
      - LLM_GROUPING_STRICTNESS=${LLM_GROUPING_STRICTNESS}
      - LLM_CLUSTER_DEDUP_THRESH=${LLM_CLUSTER_DEDUP_THRESH}
      - LLM_CROSS_BATCH_MERGE_THRESH=${LLM_CROSS_BATCH_MERGE_THRESH}
      - LLM_CLUSTER_WORKERS=${LLM_CLUSTER_WORKERS}
      - LLM_BATCH_WORKERS=${LLM_BATCH_WORKERS}
      - LLM_STAGE5_WORKERS=${LLM_STAGE5_WORKERS}
      - ZOHO_CLIENT_ID=${ZOHO_CLIENT_ID}
      - ZOHO_CLIENT_SECRET=${ZOHO_CLIENT_SECRET}
      - ZOHO_REFRESH_TOKEN=${ZOHO_REFRESH_TOKEN}
      - ZOHO_ROOT_FOLDER_ID=${ZOHO_ROOT_FOLDER_ID}
    volumes:
      - app-data:/app/app-data
      - outputs:/app/outputs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8031/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    image: vicharanashala/faqcluster-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8030:80"
    environment:
      - FAQ_API_URL=http://<pipeline-tailscale-ip>:8031
      - POP_API_URL=http://<pop-server-tailscale-ip>:8032
    depends_on:
      pipeline:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app-data:
  outputs:
